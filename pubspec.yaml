name: bmc_audio
description: "BMC Audio - Capture and decrypt audio from BMC USB Audio (UAC2.0) device with XOR-based encryption."
version: 0.2.1
homepage: https://github.com/bmctechvn/bmc_audio

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2
  # NOTE: `flutter_recorder` was removed in 0.2.1. It backed desktop capture
  # (Windows/macOS) only — Android, iOS and Linux use native capture paths and
  # never touched it. From 1.2.0 it vendors `opus.xcframework` on iOS, which
  # collides by name with `opus_flutter_ios` and breaks `pod install` in any host
  # app that has both. Rather than cap the version, we stopped making iOS pay for
  # a dependency no iOS code path uses.
  #
  # Desktop capture therefore throws UnsupportedError in this build. To restore
  # it, revert the commit that removed it — or, better, give desktop its own
  # backend package so the dependency never reaches an iOS Podfile again.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.bmc.audio.bmc_audio
        pluginClass: BmcAudioPlugin
      ios:
        pluginClass: BmcAudioPlugin
      linux:
        pluginClass: BmcAudioPlugin
      macos:
        pluginClass: BmcAudioPlugin
      windows:
        pluginClass: BmcAudioPluginCApi
      web:
        pluginClass: BmcAudioWeb
        fileName: bmc_audio_web.dart
