name: bmc_audio
description: "BMC Audio - Capture and decrypt audio from BMC USB Audio (UAC2.0) device with XOR-based encryption."
version: 0.2.1
homepage: https://github.com/bmctechvn/bmc_audio

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2
  # Desktop capture only (Windows/macOS) — iOS, Android and Linux never touch it.
  #
  # Ceiling is deliberate: 1.2.0 added Opus encoding and started vendoring
  # `opus.xcframework` on iOS. Any host app that also depends on opus_flutter_ios
  # (which vendors a framework of the same name) then fails at `pod install` with
  # "the 'Pods-Runner' target has frameworks with conflicting names". We pay that
  # cost on every iOS build for a dependency no iOS code path uses.
  #
  # Before lifting this: check whether flutter_recorder still names its iOS
  # framework plainly `opus` — upstream renamed the Android libs to
  # libfr_ogg/libfr_opus for exactly this reason, so the iOS side may follow.
  flutter_recorder: '>=1.1.2 <1.2.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.bmc.audio.bmc_audio
        pluginClass: BmcAudioPlugin
      ios:
        pluginClass: BmcAudioPlugin
      linux:
        pluginClass: BmcAudioPlugin
      macos:
        pluginClass: BmcAudioPlugin
      windows:
        pluginClass: BmcAudioPluginCApi
      web:
        pluginClass: BmcAudioWeb
        fileName: bmc_audio_web.dart
